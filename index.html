  $('fi').innerHTML=`${f.name} — ${(f.size/1048576).toFixed(2)} MB — ${f.type||'audio'}<br>ความยาว ${buf.duration.toFixed(2)} วิ · ${buf.sampleRate} Hz · ${buf.numberOfChannels} ch · <span class="ok">วิเคราะห์เสียงแล้ว</span> (เสียงพูด ${r.a.toFixed(1)}–${r.b.toFixed(1)} วิ, พบช่วงเงียบ ${r.ps.length} จุด)`;
  $('sy').className='st warn';$('sy').textContent='ซิงก์โดยประมาณ (approximate) — ไม่ใช่การจับคู่คำแบบแม่นยำ ตรวจฉากแล้วปรับ ±0.1 วิ ได้';buildSync();off=0;renderAtTime(0)}
 catch(err){abuf=null;synced=false;showErr('อ่านไฟล์เสียงไม่สำเร็จ: ไฟล์อาจเสียหรือเบราว์เซอร์ไม่รองรับ ลองไฟล์ MP3/WAV อื่น');$('fi').textContent=f.name+' — ถอดรหัสไม่ได้'}};
/* ===== EXPORT (MediaRecorder: captureStream + เสียงจากมิกซ์จริง) ===== */
let rec=null,chunks=[],mime='',expStart=0,expCancel=false,wake=null,resUrl=null,lastFile=null;
function pickMime(){return['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||''}
async function startExport(){showErr('');if(!window.MediaRecorder||!cv.captureStream){showErr('เบราว์เซอร์นี้ไม่รองรับการบันทึกวิดีโอ (MediaRecorder/captureStream) ลองใช้ Chrome หรือ Safari รุ่นใหม่');return}
 mime=pickMime();if(!mime){showErr('ไม่พบรูปแบบวิดีโอที่เบราว์เซอร์รองรับ');return}
 if(!abuf&&!confirm('ยังไม่ได้นำเข้าเสียงพากย์ วิดีโอจะไม่มีเสียงพูดและเวลาเป็นแบบประมาณ ต้องการสร้างต่อหรือไม่?'))return;
 pause();if(!ensureAC())return;try{await document.fonts.ready}catch(e){}
 try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}
 showSafe=false;exporting=true;expCancel=false;chunks=[];setFormat();
 try{const vs=cv.captureStream(FPS),ms=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);
  rec=new MediaRecorder(ms,{mimeType:mime,videoBitsPerSecond:$('rs').value==='1080'?8e6:5e6,audioBitsPerSecond:128e3});
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onstop=finishExport;rec.onerror=()=>{showErr('การบันทึกวิดีโอผิดพลาด ลองลดเป็น 720p');endExport()};
  $('ex').disabled=true;$('cx').disabled=false;$('pb').style.width='0';expStart=performance.now();rec.start(500);play(0)}
 catch(e){showErr('เริ่มสร้างวิดีโอไม่สำเร็จ: '+e.message);endExport()}}
function expTick(t){const fr=Math.floor(t*FPS),tf=Math.ceil(TOTAL*FPS);$('pb').style.width=(Math.min(t/TOTAL,.99)*100)+'%';
 $('es').textContent=`กำลังบันทึก (${mime.split(';')[0]}) ${Math.min(99,Math.floor(t/TOTAL*100))}% · เฟรม ~${fr}/${tf} · ใช้เวลา ${((performance.now()-expStart)/1000).toFixed(0)} วิ — อย่าปิดหน้านี้`;
 if(t>=TOTAL-.02&&rec&&rec.state==='recording'){pause();setTimeout(()=>{if(rec&&rec.state==='recording')rec.stop()},400)}}
function endExport(){exporting=false;$('ex').disabled=false;$('cx').disabled=true;if(wake){wake.release().catch(()=>{});wake=null}}
$('cx').onclick=()=>{expCancel=true;pause();if(rec&&rec.state!=='inactive')rec.stop();else endExport();$('es').textContent='ยกเลิกการสร้างวิดีโอแล้ว'};
function finishExport(){const cancelled=expCancel;endExport();if(cancelled){$('pb').style.width='0';return}
 const blob=new Blob(chunks,{type:mime.split(';')[0]});if(!blob.size){showErr('ไม่ได้ไฟล์วิดีโอ (ไฟล์ว่าง) ลองลดความละเอียดแล้วสร้างใหม่');return}
 const ext=mime.startsWith('video/mp4')?'mp4':'webm',name=`chicken_egg_${cv.width}x${cv.height}.${ext}`;
 if(resUrl)URL.revokeObjectURL(resUrl);resUrl=URL.createObjectURL(blob);lastFile=new File([blob],name,{type:blob.type});
 const v=$('vd');v.onloadedmetadata=()=>{$('pb').style.width='100%';$('es').innerHTML='<span class="ok">สร้างวิดีโอสำเร็จ และเปิดเล่นได้</span>';
  const d=v.duration;$('ri').innerHTML=`${name} · ${(blob.size/1048576).toFixed(2)} MB · ${cv.width}×${cv.height} · ${$('fm').selectedOptions[0].text} · ${FPS} FPS · ${blob.type} · ${isFinite(d)?d.toFixed(1)+' วิ':fmt(TOTAL)}`;$('rv').hidden=false;
  $('dl').href=resUrl;$('dl').download=name;$('sh').style.display=(navigator.canShare&&navigator.canShare({files:[lastFile]}))?'':'none'};
 v.onerror=()=>{showErr('ไฟล์ที่ได้เล่นไม่ได้ ลองสร้างใหม่หรือเปลี่ยนความละเอียด')};v.src=resUrl}
$('ex').onclick=startExport;
$('sh').onclick=async()=>{try{await navigator.share({files:[lastFile],title:'ไก่กับไข่'})}catch(e){if(e.name!=='AbortError')showErr('แชร์ไม่สำเร็จ ใช้ปุ่มดาวน์โหลดแทน')}};
$('nw').onclick=()=>{$('rv').hidden=true;$('es').textContent='พร้อมสร้างวิดีโอ';$('pb').style.width='0'};
/* ===== INIT ===== */
try{if(!cv.getContext)throw 0;buildChips();buildSync();setFormat();loop();(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>renderAtTime(curT()))}catch(e){showErr('ไม่สามารถเริ่ม Canvas ได้ กรุณาใช้เบราว์เซอร์รุ่นใหม่')}
</script></body></html>
